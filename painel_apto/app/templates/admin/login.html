{% extends "base.html" %}
{% block title %}Anfitrião — Login{% endblock %}
{% block content %}
<div class="center-card">
  <h1>🔑 Área do anfitrião</h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" class="form-grid">
    <input type="password" name="password" placeholder="Senha" required autofocus>
    {% if totp_enabled %}
    <input type="tel" name="totp_code" inputmode="numeric" maxlength="6"
           pattern="[0-9]{6}" placeholder="Código do autenticador" required>
    {% endif %}
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
